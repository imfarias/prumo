name: ci
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Os runners do GitHub já têm Chrome; a ausência de navegador é falha, não teste pulado.
      PRUMO_EXIGIR_NAVEGADOR: '1'
      # A referência visual do exemplo foi gerada no Windows; no Linux o antialiasing difere < 1%.
      PRUMO_TOLERANCIA_VISUAL: ${{ matrix.os == 'ubuntu-latest' && '1.5' || '0.5' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Liberar o sandbox do Chromium (Ubuntu 24 restringe user namespaces)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run tipos
      # Os testes do programa abrem o Electron; no Linux sem tela, pelo xvfb.
      - run: npm run cobertura
        if: runner.os == 'Windows'
      - run: xvfb-run -a npm run cobertura
        if: runner.os == 'Linux'
      - name: Verificar o exemplo fictício
        run: node apps/cli/dist/main.js verificar --specs exemplos/exemplo-ficticio

  docker:
    needs: testes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t prumo:ci .
      - name: Rodar o exemplo na imagem
        run: |
          cp -r exemplos/exemplo-ficticio /tmp/specs && find /tmp/specs -name '*.png' -delete && chmod -R a+w /tmp/specs && mkdir -p /tmp/html && chmod a+w /tmp/html
          docker run --rm -v /tmp/specs:/docs prumo:ci capturar --specs /docs --saida /tmp/saida
          test -f /tmp/specs/01_Portal/02_Portal_Lista_Parceiras.png
          docker run --rm -v /tmp:/trabalho -w /trabalho prumo:ci docs --specs /trabalho/specs
          test -f /tmp/html/index.html
          docker run --rm -v /tmp:/trabalho -w /trabalho prumo:ci pdf --specs /trabalho/specs --saida /trabalho/tudo.pdf
          test -s /tmp/tudo.pdf
      - name: Publicar no GHCR (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          versao="${GITHUB_REF_NAME#v}"
          docker tag prumo:ci "ghcr.io/${{ github.repository }}:$versao"
          docker tag prumo:ci "ghcr.io/${{ github.repository }}:latest"
          docker push "ghcr.io/${{ github.repository }}:$versao"
          docker push "ghcr.io/${{ github.repository }}:latest"

  instaladores:
    needs: testes
    # Nas tags quem gera e testa é o release.yml.
    if: github.ref_type != 'tag'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build --workspace @prumo/motor
      - name: Gerar os instaladores
        run: npm run dist --workspace @prumo/desktop
      - name: Testar instalar, verificar e desinstalar
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -File apps/desktop/scripts/testar-instaladores.ps1 apps/desktop/release
          else
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            bash apps/desktop/scripts/testar-instaladores.sh apps/desktop/release
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ runner.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi
            apps/desktop/release/*.deb
            apps/desktop/release/*.AppImage
          retention-days: 7
