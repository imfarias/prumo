  05_API: { casca: publica }
padroes:
  listas_sempre_em_tela: true
  paginacao: 10
  container_max: 1280
dados_ficticios:
  cnpj: alfanumerico
  sufixo_nomes: Exemplo
mascaras:
  CNPJ: "XX.XXX.XXX/XXXX-##"
  CPF: "###.###.###-##"
  CEP: "##.###-###"
  Fone: ["(##) ####-####", "(##) #####-####"]
documentacao:
  arquivo_unico: false
  pdf: retrato
  prototipo_aberto: true
