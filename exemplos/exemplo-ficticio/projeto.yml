# Projeto fictício usado nos testes e na demonstração do Prumo.
projeto:
  nome: Programa Exemplo
  versao: "1.0"
  orgao: Órgão Exemplo
  logo: Logo/logo.svg
identidade:
  design_system: proprio
  cores: { fundo: "#FFFFFF", texto: "#0E1A33", primaria: "#1D3F8F", menu: "#0E1A33", menu_texto: "#C3CDE3", destaque: "#E9B03A", erro: "#B3261E" }
  fontes: { titulo: Jost, texto: Atkinson Hyperlegible }
largura_captura: 1440
cascas:
